<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>STUDIO — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@48,700&family=Noto+Sans+KR:wght@300..600&family=Noto+Serif+Display:wdth,wght@92,300..400&family=Noto+Serif+KR:wght@300..700&family=Urbanist:wght@300..600&display=swap">
<style>
:root{
  --paper:#f7f2ee;--ink:#1b1a19;--ink-2:#5c5854;--ink-3:#716c67;--line:#ddd6cf;--line-strong:#b5afa9;--night:#121112;
  --display:'Noto Serif Display','Noto Serif KR','Times New Roman','AppleMyungjo','Batang',serif;
  --head:'Bodoni Moda','Noto Serif KR','Times New Roman','AppleMyungjo','Batang',serif;
  --sans:'Urbanist','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --ease:cubic-bezier(.19,1,.22,1);
  --gutter:9.5vw;--bar:clamp(68px,5.7vw,82px);--u:1vh;
}
@supports (height:1svh){:root{--u:1svh}}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scrollbar-width:thin;scrollbar-color:#c9c1b9 var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 13px/1.9 var(--sans);-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;border-radius:0;padding:0;cursor:pointer;text-align:inherit;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:1.5px solid currentColor;outline-offset:5px}
::selection{background:var(--ink);color:var(--paper)}
[hidden]{display:none!important}

/* type */
.display{font-family:var(--display);font-weight:300;font-size:var(--fs);line-height:1.06;letter-spacing:-.01em;text-transform:uppercase;font-variant-numeric:lining-nums;white-space:pre-line;overflow-wrap:normal;text-wrap:balance}
.display.ko{font-size:calc(var(--fs)*.78);line-height:1.2;letter-spacing:-.03em}
.label{font:400 12px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;font-variant-numeric:tabular-nums lining-nums}
.ko.label,.label .ko{letter-spacing:.06em}

/* arrow link: the one control the page repeats */
.go{display:inline-flex;align-items:center;gap:clamp(8px,1vw,14px);min-height:44px;font:600 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.go .ko{font-size:12px;font-weight:500;letter-spacing:.07em}
.go i{position:relative;flex:none;width:72px;height:7px}
.go i::before{content:'';position:absolute;left:0;top:3px;width:58px;height:1px;background:currentColor;transform-origin:left;transition:transform .6s var(--ease)}
.go i::after{content:'';position:absolute;left:54px;top:0;border-style:solid;border-width:3.5px 0 3.5px 6px;border-color:transparent transparent transparent currentColor;transition:transform .6s var(--ease)}
.go:hover i::before,.go:focus-visible i::before,.feature:has(.feature-photo:hover) .go i::before,.next:hover .go i::before{transform:scaleX(1.24)}
.go:hover i::after,.go:focus-visible i::after,.feature:has(.feature-photo:hover) .go i::after,.next:hover .go i::after{transform:translateX(14px)}
.go.back i{transform:scaleX(-1)}

/* photo frame + empty plate */
.photo{position:relative;display:block;overflow:hidden;background:#e4ddd6}
.photo>img,.photo>.plate{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.5s var(--ease)}
.plate{display:grid;place-items:center;background:var(--tone,#d5cec6);color:var(--tone-ink,#b9b1a8)}
.plate svg{width:44%;height:44%;overflow:visible}
.plate text{font:300 64px var(--display);fill:currentColor;font-variant-numeric:lining-nums}
.plate-label{position:absolute;left:8%;right:8%;bottom:7%;font:400 10.5px/1.5 var(--sans);letter-spacing:.12em;text-align:center;color:var(--tone-label,#57514b)}
.plate.t2{--tone:#cfcdc8;--tone-ink:#b3b0aa;--tone-label:#55524e}
.plate.dark{--tone:#3b3a37;--tone-ink:#565450;--tone-label:#b5b1ab}
.plate.light{--tone:#d9d8d5;--tone-ink:#bdbbb7;--tone-label:#55524e}
.plate.night{--tone-ink:rgba(255,255,255,.075);--tone-label:rgba(255,255,255,.62)}
.plate.n1{background:radial-gradient(120% 90% at 62% 108%,#3a3938 0%,rgba(58,57,56,0) 62%),#171617}
.plate.n2{background:radial-gradient(120% 90% at 30% 108%,#423c36 0%,rgba(66,60,54,0) 62%),#1d1a18}
.plate.n3{background:radial-gradient(120% 90% at 78% 104%,#353a3f 0%,rgba(53,58,63,0) 62%),#15181a}
.plate.night svg{width:34%;height:46%;margin-top:20%}
.plate.night .plate-label{left:auto;right:2.9vw;top:22px;bottom:auto;text-align:right}

/* header */
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;column-gap:16px;height:var(--bar);padding:0 var(--gutter)}
.nav{display:flex;align-items:center;gap:clamp(18px,3.1vw,45px);color:var(--ink-2)}
.nav a{position:relative;margin:0 -6px;padding:16px 6px;transition:color .3s}
.nav a::after{content:'';position:absolute;left:6px;right:6px;bottom:8px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .6s var(--ease)}
.nav a:hover,.nav a:focus-visible{color:var(--ink)}
.nav a:hover::after,.nav a:focus-visible::after{transform:scaleX(1)}
.mark{display:grid;place-items:center;width:clamp(52px,4.3vw,62px);aspect-ratio:1;border:1px solid #8c8782;border-radius:999px;font:500 clamp(8px,.63vw,9px)/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;color:var(--ink-2);transition:color .3s,border-color .3s}
.mark:hover{color:var(--ink);border-color:var(--ink)}
.mark.is-long{width:auto;aspect-ratio:auto;height:clamp(38px,3.4vw,48px);padding:0 20px}
.meta{display:flex;align-items:center;justify-content:flex-end;gap:clamp(10px,1.5vw,22px);color:var(--ink-2)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ink)}

/* 1 · hero */
.hero{position:relative;height:min(57vw,calc(var(--u)*100 - var(--bar)));min-height:440px;overflow:hidden;isolation:isolate;background:var(--night);color:#fff;touch-action:pan-y}
.slide{position:absolute;inset:0;overflow:hidden;opacity:0}
.slide.is-on{z-index:2;opacity:1;transition:opacity 1.7s cubic-bezier(.4,0,.2,1)}
.slide.was-on{z-index:1;opacity:1}
.slide>img,.slide>.plate{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slide.is-on>*,.slide.was-on>*{animation:drift 9s cubic-bezier(.2,.7,.3,1) both}
@keyframes drift{from{transform:scale(1.07)}to{transform:scale(1)}}
.slide::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(12,10,11,calc(var(--veil,.2) + .16)) 0%,rgba(12,10,11,var(--veil,.2)) 18%,rgba(12,10,11,var(--veil,.2)) 54%,rgba(12,10,11,var(--low,.6)) 74%,rgba(12,10,11,var(--low,.6)) 100%)}
.hero-copy{position:absolute;z-index:4;left:0;right:0;top:24%;padding:0 7vw;text-align:center;pointer-events:none}
.hero-title{--fs:clamp(32px,4.87vw,74px);font-weight:340;max-width:86vw;margin:0 auto;text-shadow:0 1px 34px rgba(0,0,0,.28)}
.hero-sub{margin-top:clamp(16px,3vw,44px);font:400 12px/1.8 var(--sans);letter-spacing:.14em;text-transform:uppercase;text-shadow:0 0 18px rgba(0,0,0,.35)}
.hero-sub.ko{font-size:12.5px;letter-spacing:.08em}
.hero-foot{position:absolute;z-index:4;left:4vw;right:2.9vw;bottom:clamp(8px,1.2vw,18px);display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.hero-caption{max-width:30em;font:400 12px/1.95 var(--sans);letter-spacing:.1em;text-transform:uppercase;white-space:pre-line;text-shadow:0 0 18px rgba(0,0,0,.35)}
.hero-caption.ko{font-size:12.5px;letter-spacing:.04em}
.hero-caption+.go{margin-top:clamp(6px,2vw,28px)}
.hero-index{display:flex;align-items:center}
.hero-index button{position:relative;width:36px;height:44px;font:500 11px/1 var(--sans);letter-spacing:.08em;text-align:center;font-variant-numeric:tabular-nums lining-nums;opacity:.7;transition:opacity .4s}
.hero-index button:hover{opacity:.9}
.hero-index button[aria-current="true"]{opacity:1}
.hero-index b{position:absolute;left:9px;right:9px;bottom:9px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:left}
.hero-index .toggle{margin-right:4px;opacity:.72}
.hero-index svg{display:block;width:10px;height:10px;margin:auto;fill:none;stroke:currentColor;stroke-width:1.3}
.hero-index .i-play{fill:currentColor;stroke:none}
.hero-index .toggle:not(.is-held) .i-play,.hero-index .toggle.is-held .i-pause{display:none}

/* 2 · two works */
.works{padding:clamp(76px,12vw,174px) 0 clamp(72px,11.5vw,166px);--card-h:clamp(250px,33.3vw,calc(var(--u)*64));--card-w:calc(var(--card-h)*.75)}
.works-title{width:max-content;max-width:calc(100vw - 2*var(--gutter));margin:0 auto clamp(30px,4vw,57px);font:700 clamp(21px,2.3vw,33px)/1.12 var(--head);letter-spacing:-.04em;white-space:pre-line}
.works-title.ko{font-family:'Noto Serif KR',var(--head);font-size:clamp(20px,2.05vw,30px);font-weight:600;line-height:1.36;letter-spacing:-.035em}
.strip{position:relative;width:max-content;margin:0 auto}
.side{position:absolute;right:calc(100% + clamp(22px,3.4vw,50px));top:calc(var(--card-h)/2);transform:translateY(-50%) rotate(180deg);writing-mode:vertical-rl;text-orientation:sideways;font:700 clamp(18px,2vw,28px)/1.3 var(--head);letter-spacing:-.04em;white-space:pre}
.side.ko{font-family:'Noto Serif KR',var(--head);font-weight:600;letter-spacing:-.03em}
.cards{display:flex;gap:clamp(10px,1.8vw,26px)}
.card{display:block;width:var(--card-w);text-align:center}
.card .photo{height:var(--card-h)}
.card:hover .photo>*,.card:focus-visible .photo>*,.feature-photo:hover .photo>*,.shot:hover .photo>*{transform:scale(1.035)}
.cap{display:block;padding-top:19px}
.cap>span{display:block}
.cap-title{font:500 12px/1.6 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.cap-title.ko{letter-spacing:.05em}
.cap-cat{margin-top:5px;font:400 12.5px/1.6 var(--sans);color:var(--ink-2)}
.cap-year{margin-top:5px;font:400 12px/1.6 var(--sans);letter-spacing:.06em;color:var(--ink-3)}
.works-foot{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-top:clamp(30px,3.6vw,51px)}
.rule{position:relative;flex:0 0 46%;height:1px;background:var(--line)}
.rule i{position:absolute;left:0;top:-1px;width:calc(100%/var(--n,2));height:3px;background:var(--line-strong);transform:translateX(calc(var(--at,0)*100%));transition:transform .8s var(--ease)}
.hint{font:400 12px/1.6 var(--sans);color:var(--ink-3);text-align:right}

/* 3 · 4 · one project each, photo flush to alternate edges */
main{padding-bottom:clamp(84px,13.8vw,200px)}
.feature{display:grid;grid-template-columns:61vw minmax(0,1fr);align-items:end}
.feature+.feature{margin-top:clamp(84px,13.8vw,200px)}
.feature-photo{display:block;width:100%}
.feature-photo .photo{aspect-ratio:5/4;max-height:calc(var(--u)*92)}
.feature-copy{min-width:0;padding:0 4vw 0 6.3vw}
.feature-title{--fs:clamp(40px,6.9vw,100px)}
.feature-text{max-width:31em;margin:clamp(14px,2.7vw,39px) 0 clamp(14px,3.2vw,46px);font:400 13px/2 var(--sans);color:var(--ink-2);white-space:pre-line}
.feature-text:not(.ko){max-width:min(23vw,27em);font-size:12px;letter-spacing:.09em;text-transform:uppercase}
.feature-copy .go{margin-bottom:-14px}
.feature.flip{grid-template-columns:minmax(0,1fr) 61vw}
.feature.flip .feature-photo{grid-column:2;grid-row:1}
.feature.flip .feature-copy{grid-column:1;grid-row:1;padding:0 4vw 0 var(--gutter)}

/* footer */
.foot{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;margin:0 var(--gutter);padding:24px 0 28px;border-top:1px solid var(--line);color:var(--ink-2)}
.foot .mark{justify-self:start}
.foot .go{justify-self:end;gap:12px}
.foot .go svg{width:7px;height:26px;fill:currentColor;stroke:currentColor;stroke-width:1;overflow:visible;transition:transform .6s var(--ease)}
.foot .go:hover svg,.foot .go:focus-visible svg{transform:translateY(-5px)}

/* project page */
.detail-bar{position:sticky;top:0;z-index:6;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;column-gap:16px;height:64px;padding:0 var(--gutter);background:var(--paper);border-bottom:1px solid var(--line)}
.detail-bar .go{justify-self:start}
.detail-bar .go:last-child{justify-self:end}
.detail-count{color:var(--ink-2)}
.spread{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:start}
.detail-cover{position:sticky;top:64px;width:min(46vw,calc((var(--u)*100 - 64px)*var(--r,1.25)))}
.detail-cover .photo{aspect-ratio:var(--r,1.25)}
.detail-copy{min-width:0;padding:clamp(40px,6.4vw,92px) var(--gutter) clamp(40px,5vw,72px) 6.3vw}
.detail-title{--fs:clamp(36px,5.55vw,82px)}
.detail-meta{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:clamp(18px,2.2vw,32px);line-height:1.6;color:var(--ink-2)}
.detail-meta span+span::before{content:'';display:inline-block;width:18px;height:1px;margin-right:20px;vertical-align:middle;background:var(--line-strong)}
.detail-text{max-width:34em;margin-top:clamp(22px,3.2vw,46px);font:400 15px/1.95 var(--sans);color:#3b3835;white-space:pre-line}
.detail.flip .spread{grid-template-columns:minmax(0,1fr) auto}
.detail.flip .detail-cover{grid-column:2;grid-row:1}
.detail.flip .detail-copy{grid-column:1;grid-row:1;padding-left:var(--gutter);padding-right:6.3vw}
.shots{padding:clamp(72px,11vw,160px) 0 clamp(64px,9.6vw,138px)}
.shots .strip{width:auto;margin:0 var(--gutter) 0 16.45vw}
.shots-row{display:flex;align-items:flex-start;gap:clamp(10px,1.8vw,26px);max-width:calc(var(--sum,2.25)*min(var(--u)*62,30vw) + (var(--n,3) - 1)*clamp(10px,1.8vw,26px))}
.shots-row li{flex:var(--r,.75) 1 0;min-width:0}
.shot{display:block;width:100%;text-align:center}
.shot:not(:disabled){cursor:zoom-in}
.shot .photo{aspect-ratio:var(--r,.75)}
.next{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;width:calc(100% - 2*var(--gutter));margin:0 var(--gutter);padding:clamp(26px,3.6vw,52px) 0 clamp(30px,4vw,58px);border-top:1px solid var(--line)}
.next-title{--fs:clamp(29px,4.6vw,67px);min-width:0}
.next .go{margin-bottom:-10px}

/* zoomed photo */
.probe{position:fixed;inset:0;visibility:hidden;pointer-events:none}
.lb{position:fixed;inset:0;width:100%;height:100%;max-width:none;max-height:none;margin:0;padding:0;border:0;overflow:hidden;overscroll-behavior:contain;background:var(--night);color:#fff}
.lb::backdrop{background:var(--night)}
.lb-stage{position:absolute;inset:64px clamp(16px,6vw,90px) 96px;display:grid;grid-template:minmax(0,1fr)/minmax(0,1fr);place-items:center;touch-action:pan-y pinch-zoom}
.lb-stage img{width:auto;height:auto;max-width:100%;max-height:100%;object-fit:contain}
.lb-stage .plate{position:relative;width:min(100%,620px);aspect-ratio:4/3}
.lb-close{position:absolute;z-index:2;top:10px;right:clamp(6px,4vw,58px);display:grid;place-items:center;width:44px;height:44px;opacity:.8;transition:opacity .3s}
.lb-close:hover{opacity:1}
.lb-close svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.2}
.lb-foot{position:absolute;left:clamp(16px,6vw,90px);right:clamp(16px,6vw,90px);bottom:16px;display:grid;grid-template-columns:72px minmax(0,1fr) 72px;align-items:center;gap:16px;text-align:center}
.lb-foot .go{gap:0}
.lb-cap{margin-top:8px;font:400 12.5px/1.6 var(--sans);color:rgba(255,255,255,.74)}
.lb.is-single .lb-foot .go{visibility:hidden}

/* motion: things are unveiled from the edge they sit on */
.anim .hero-copy>*,.anim .hero-foot>*{opacity:0;transform:translateY(20px);transition:opacity 1.3s var(--ease),transform 1.5s var(--ease)}
.anim.is-ready .hero-copy>*,.anim.is-ready .hero-foot>*{opacity:1;transform:none}
.anim.is-ready .hero-sub{transition-delay:.16s}
.anim.is-ready .hero-foot>*{transition-delay:.34s}
.anim [data-rv="wipe"] .photo{clip-path:inset(0 100% 0 0);transition:clip-path 1.6s var(--ease)}
.anim .flip>[data-rv="wipe"] .photo{clip-path:inset(0 0 0 100%)}
.anim [data-rv="lift"] .photo{clip-path:inset(100% 0 0 0);transition:clip-path 1.5s var(--ease) var(--d,0s)}
.anim [data-rv].in .photo{clip-path:inset(0)}
.anim [data-rv="wipe"]:not(.in) .photo>*,.anim [data-rv="lift"]:not(.in) .photo>*{transform:scale(1.14)}
.anim [data-rv="lift"] .cap{opacity:0;transition:opacity 1.2s var(--ease) calc(var(--d,0s) + .35s)}
.anim [data-rv="lift"].in .cap{opacity:1}
.anim [data-rv="rise"]>*{opacity:0;transform:translateY(24px);transition:opacity 1.2s var(--ease),transform 1.4s var(--ease)}
.anim [data-rv="rise"].in>*{opacity:1;transform:none}
.anim [data-rv="rise"]>:nth-child(2){transition-delay:.12s}
.anim [data-rv="rise"]>:nth-child(3){transition-delay:.24s}
.anim [data-rv="fade"]{opacity:0;transition:opacity 1.4s var(--ease) .2s}
.anim [data-rv="fade"].in{opacity:1}
.detail.is-entering{animation:enter .7s var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateY(14px)}}
.lb.is-entering{animation:lb-in .4s ease both}
@keyframes lb-in{from{opacity:0}}
.lb-stage>*{animation:lb-in .45s ease both}
::view-transition-group(photo){animation-duration:.8s;animation-timing-function:cubic-bezier(.3,0,.1,1)}
::view-transition-old(photo),::view-transition-new(photo){width:100%;height:100%;object-fit:cover}
::view-transition-old(root){animation-duration:.32s}
::view-transition-new(root){animation-duration:.6s;animation-delay:.14s}

@media (max-width:760px){
  :root{--gutter:22px;--bar:60px}
  .top{padding:0 18px;column-gap:10px}
  .nav{gap:16px}
  .label{font-size:10.5px;letter-spacing:.12em}
  .w{display:none}
  .mark{width:48px;font-size:8px;letter-spacing:.06em}
  .mark.is-long{padding:0 14px}
  .hero{height:min(150vw,calc(var(--u)*100 - var(--bar)));min-height:470px}
  .hero-copy{top:19%;padding:0 22px}
  .hero-title{--fs:clamp(30px,9.7vw,50px);font-weight:380}
  .hero-foot{left:22px;right:8px;bottom:10px}
  .hero-index button{width:30px}
  .go i{width:50px}
  .go i::before{width:36px}
  .go:hover i::before,.go:focus-visible i::before{transform:scaleX(1.38)}
  .go i::after{left:32px}
  .works{padding:76px 0 72px;--card-w:calc((100vw - 92px)/2);--card-h:calc(var(--card-w)*4/3)}
  .works-title{font-size:23px}
  .works-title.ko{font-size:21px}
  .strip{width:auto;margin:0 18px 0 64px}
  .side{right:calc(100% + 10px);font-size:17px}
  .cards{gap:10px}
  .cap{padding-top:13px}
  .cap-title{font-size:10.5px;letter-spacing:.1em}
  .cap-cat{font-size:12px}
  .works-foot{flex-direction:column;align-items:flex-start;gap:16px;margin-top:26px}
  .rule{flex:none;width:58%}
  .hint{text-align:left}
  .feature,.feature.flip{display:block}
  .feature-photo{width:88%}
  .feature.flip .feature-photo{margin-left:12%}
  .feature-copy,.feature.flip .feature-copy{padding:34px 22px 0}
  .feature-title{--fs:clamp(36px,12vw,58px)}
  .feature-title,.detail-title,.next-title{font-weight:340}
  .feature-text{margin:20px 0 10px;font-size:14px;line-height:1.95}
  .feature-text:not(.ko){max-width:none;font-size:12.5px}
  .feature-copy .go{margin-bottom:0}
  .foot{grid-template-columns:auto 1fr;row-gap:10px;padding:20px 0 26px}
  .foot p{grid-column:1/-1;grid-row:2}
  .detail-bar{grid-template-columns:1fr auto;height:56px}
  .detail-bar .go:last-child{display:none}
  .spread,.detail.flip .spread{display:block}

<script id="portfolio-data" type="application/json">{"brand": "STUDIO", "headline": "A quiet point\nof view.", "subtitle": "작업의 결과와 그 안에 담긴 이야기를 소개합니다.", "heroCaption": "두 개의 작업을 사진과 글로\n차례대로 소개합니다.", "worksTitle": "두 개의 작업,\n각자의 이야기.", "worksLabel": "Selected\nworks", "hero": ["", "", ""], "projects": [{"title": "Project 01", "category": "첫 번째 포트폴리오", "year": "", "cover": "", "thumb": "", "summary": "첫 번째 작업을 소개하는 짧은 설명을 입력해 주세요.\n이미지를 누르면 작업의 디테일을 볼 수 있습니다.", "description": "이곳에 첫 번째 작업의 자세한 설명을 입력해 주세요.\n\n작업의 배경, 진행 과정, 중요하게 생각한 부분과 완성된 결과를 차례로 소개할 수 있습니다.", "photos": ["", "", ""], "captions": ["", "", ""]}, {"title": "Project 02", "category": "두 번째 포트폴리오", "year": "", "cover": "", "thumb": "", "summary": "두 번째 작업을 소개하는 짧은 설명을 입력해 주세요.\n이미지를 누르면 작업의 디테일을 볼 수 있습니다.", "description": "이곳에 두 번째 작업의 자세한 설명을 입력해 주세요.\n\n작업의 배경, 진행 과정, 중요하게 생각한 부분과 완성된 결과를 차례로 소개할 수 있습니다.", "photos": ["", "", ""], "captions": ["", "", ""]}]}</script>
<script>
'use strict';
(() => {
const data = JSON.parse(document.getElementById('portfolio-data').textContent);
const $ = id => document.getElementById(id);

function renderProject(i) {

{
